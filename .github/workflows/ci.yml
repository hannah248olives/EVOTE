name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager", Node from .nvmrc
      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter @evote/api test
      - run: pnpm --filter @evote/api build
