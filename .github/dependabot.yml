version: 2

updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/apps/*"
      - "/packages/*"
      - "/workers/*"
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Kampala
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Kampala
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
